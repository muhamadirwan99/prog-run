name: Deploy Road to 10K Tracker to GitHub Pages

on:
  push:
    # Mendukung branch master (aktif lokal) maupun main
    branches: [main, master]
  workflow_dispatch:

# Izin minimal untuk GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Batalkan deploy lama jika ada push baru berturut-turut
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check & Build Vite + PWA
        run: npm run build

      - name: Upload artifact untuk GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
